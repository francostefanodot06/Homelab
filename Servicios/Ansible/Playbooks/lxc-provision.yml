- name: Aprovisionar y Hardening de LXC en Proxmox
  hosts: proxmox # Apunta al hipervisor en tu inventory.ini
  gather_facts: false
  tasks:
    - name: 1. Configurar Zona Horaria a Buenos Aires
      raw: pct exec {{ vmid }} -- timedatectl set-timezone America/Argentina/Buenos_Aires

    - name: 2. Actualizar sistema e instalar utilidades base y seguridad
      raw: |
        pct exec {{ vmid }} -- env DEBIAN_FRONTEND=noninteractive apt-get update
        pct exec {{ vmid }} -- env DEBIAN_FRONTEND=noninteractive apt-get install -y curl wget htop fail2ban

        - name: 2.5. Habilitar TUN en la configuración del LXC para Tailscale
      raw: |
        grep -q "lxc.cgroup2.devices.allow: c 10:200 rwm" /etc/pve/lxc/{{ vmid }}.conf || echo "lxc.cgroup2.devices.allow: c 10:200 rwm" >> /etc/pve/lxc/{{ vmid }}.conf
        grep -q "lxc.mount.entry: /dev/net/tun" /etc/pve/lxc/{{ vmid }}.conf || echo "lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file" >> /etc/pve/lxc/{{ vmid }}.conf
        pct stop {{ vmid }} && pct start {{ vmid }}

    - name: 3. Instalar Tailscale para acceso remoto seguro
      raw: pct exec {{ vmid }} -- bash -c "curl -fsSL https://tailscale.com/install.sh | sh"

    - name: 3.5. Inyectar llave pública SSH de Semaphore
      raw: |
        pct exec {{ vmid }} -- mkdir -p /root/.ssh
        pct exec {{ vmid }} -- chmod 700 /root/.ssh
        pct exec {{ vmid }} -- bash -c "cat /root/semaphore_key.pub >> /root/.ssh/authorized_keys"
        pct exec {{ vmid }} -- chmod 600 /root/.ssh/authorized_keys
        
    - name: 4. Hardening de SSH (Deshabilitar login por contraseña)
      raw: |
        pct exec {{ vmid }} -- sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
        pct exec {{ vmid }} -- sed -i 's/^#*PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config

    - name: 5. Aplicar cambios y activar servicios
      raw: |
        pct exec {{ vmid }} -- systemctl restart ssh
        pct exec {{ vmid }} -- systemctl enable --now fail2ban
