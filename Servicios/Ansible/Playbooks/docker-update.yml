- name: Mantenimiento de Contenedores Docker
  hosts: docker_nodes
  become: true
  tasks:
    - name: Actualizar contenedores y limpiar imágenes con Watchtower
      community.docker.docker_container:
        name: watchtower
        image: containrrr/watchtower
        env:
          DOCKER_API_VERSION: "1.44"
        security_opts:
          - apparmor:unconfined
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        command: --run-once --cleanup
        state: started
        detach: false