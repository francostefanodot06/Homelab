- name: Mantenimiento de Contenedores Docker
  hosts: docker_nodes # Grupo en tu inventory.ini con las IPs de los LXC
  become: true
  tasks:
    - name: Actualizar contenedores y limpiar imágenes con Watchtower
      community.docker.docker_container:
        name: watchtower
        image: containrrr/watchtower
        api_version: "1.44"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        command: --run-once --cleanup
        state: started
        detach: false
